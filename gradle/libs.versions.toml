[versions]
#KOTLIN
agp = "9.4.1"
kotlin = "2.4.20"
coreKtx = "1.19.1"
ksp = "2.3.10"

#DEPENDENCY INJECTION
hilt = "2.60.1"
hilt-compiler = "2.60.1"
hilt-navigation-compose ="1.4.0"

#LOCAL_DATABASE
room ="3.0.3"

#NETWORK
retrofit = "3.1.0-SNAPSHOT"

#WORK
work = "2.12.0"

#TEST
junit = "4.13.2"
junitVersion = "1.3.0"

espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
